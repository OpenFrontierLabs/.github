name: Feature request
description: Propose a new capability or an improvement
labels: ["type/feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Unsure whether it is worth an issue? Start in [Ideas](https://github.com/OpenFrontierLabs/openfrontier/discussions/categories/ideas).
        Changes that are hard to reverse (protocol messages, ledger schema, licences, layer boundaries) need an [RFC](https://github.com/OpenFrontierLabs/openfrontier/blob/main/rfcs/README.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and who does it affect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to see. Concrete commands, files or behaviour.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options:
        - "Not sure"
        - "1 Hardware (ofl doctor)"
        - "2 Node"
        - "3 Network"
        - "4 Training"
        - "5 Storage and evidence"
        - "6 Console / website"
        - "7 Hosting"
        - "8 Outputs and evals"
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this.
