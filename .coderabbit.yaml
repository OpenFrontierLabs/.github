# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: >-
  Plain and direct. Flag real mistakes and claims the project cannot back. No praise, no emoji.
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  auto_apply_labels: false
  auto_assign_reviewers: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_instructions:
    - path: "profile/**"
      instructions: >-
        Public org profile. No claims about results, traction, users, funding or partnerships;
        anything not built is labelled planned.
